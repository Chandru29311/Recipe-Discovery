<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Recipe Not Found | Stackly</title>
  <meta name="description" content="Oops! This recipe or culinary page has left our kitchen table. Return to the Stackly Recipe Discovery collection.">

  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="assets/images/chan.webp">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- AOS (Animate On Scroll) CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    /* Full Page Layout & Alignment */
    body.error-page-body {
      background: radial-gradient(circle at 50% 25%, #1e293b 0%, #0f172a 70%, #020617 100%);
      color: #fafaf9;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 2.5rem 1.25rem;
      box-sizing: border-box;
      font-family: var(--font-sans);
    }

    /* Ambient glow behind card */
    .error-ambient-glow {
      position: absolute;
      width: min(650px, 90vw);
      height: min(650px, 90vw);
      background: radial-gradient(circle, rgba(234, 88, 12, 0.22) 0%, rgba(15, 23, 42, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    /* Floating Decorative Culinary Icons (Desktop only) */
    .error-floating-icon {
      position: absolute;
      color: rgba(234, 88, 12, 0.16);
      pointer-events: none;
      z-index: 1;
      animation: floatBadge 6s ease-in-out infinite alternate;
    }

    @media (max-width: 768px) {
      .error-floating-icon {
        display: none !important;
      }
    }

    /* Centered Glassmorphic Card */
    .error-content-card {
      position: relative;
      z-index: 2;
      max-width: 640px;
      width: 100%;
      text-align: center;
      background: rgba(30, 41, 59, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 3.25rem 2.5rem;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.65);
      box-sizing: border-box;
      margin: auto 0;
    }

    .error-brand-wrap {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .error-brand-wrap a {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }

    .error-brand-logo-img {
      height: 48px;
      width: auto;
      max-width: 190px;
      object-fit: contain;
      display: block;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 4px 14px rgba(234, 88, 12, 0.45));
    }

    .error-brand-wrap a:hover .error-brand-logo-img {
      transform: scale(1.06);
    }

    .error-code-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(234, 88, 12, 0.18);
      border: 1px solid rgba(234, 88, 12, 0.4);
      color: #fdba74;
      padding: 0.35rem 1rem;
      border-radius: var(--radius-pill);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .error-huge-number {
      font-family: var(--font-serif);
      font-size: clamp(4.5rem, 14vw, 7.5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 40%, #fdba74 75%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0.25rem 0 0.5rem;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(1.35rem, 3.5vw, 1.95rem);
      margin: 1rem 0 0.75rem;
      color: #ffffff;
      font-weight: 700;
      line-height: 1.25;
    }

    .error-desc {
      color: #94a3b8;
      font-size: 0.96rem;
      line-height: 1.6;
      max-width: 480px;
      margin: 0 auto 1.85rem;
    }

    .error-cta-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .error-cta-group .btn {
      padding: 0.85rem 1.6rem;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
    }

    .btn-outline-light {
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-radius: var(--radius-pill);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    .btn-outline-light:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    /* Quick Links Pill Bar */
    .quick-links-pill-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.82rem;
      color: #94a3b8;
    }

    .quick-links-title {
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    .quick-links-items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .quick-links-pill-bar a {
      color: #fdba74;
      padding: 0.35rem 0.9rem;
      border-radius: var(--radius-pill);
      background: rgba(234, 88, 12, 0.12);
      border: 1px solid rgba(234, 88, 12, 0.25);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
    }

    .quick-links-pill-bar a:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 540px) {
      body.error-page-body {
        padding: 1.5rem 1rem;
      }

      .error-content-card {
        padding: 2.25rem 1.25rem;
        border-radius: var(--radius-md);
      }

      .error-cta-group {
        flex-direction: column;
        width: 100%;
        gap: 0.75rem;
      }

      .error-cta-group .btn {
        width: 100%;
        box-sizing: border-box;
      }

      .quick-links-items {
        gap: 0.4rem;
      }

      .quick-links-pill-bar a {
        font-size: 0.78rem;
        padding: 0.25rem 0.65rem;
      }
    }

    @media (max-height: 650px) {
      body.error-page-body {
        justify-content: flex-start;
      }

      .error-content-card {
        margin-top: 1rem;
        margin-bottom: 1rem;
      }
    }
  </style>
</head>
<body class="error-page-body">

  <!-- Ambient glow backdrop -->
  <div class="error-ambient-glow"></div>

  <!-- Floating Culinary Icons (Large Screens) -->
  <i class="fa-solid fa-utensils error-floating-icon" style="top: 12%; left: 8%; font-size: 2.5rem; animation-delay: 0s;"></i>
  <i class="fa-solid fa-bowl-food error-floating-icon" style="top: 20%; right: 10%; font-size: 2.2rem; animation-delay: 1.2s;"></i>
  <i class="fa-solid fa-pizza-slice error-floating-icon" style="bottom: 15%; left: 12%; font-size: 3rem; animation-delay: 2.4s;"></i>
  <i class="fa-solid fa-cake-candles error-floating-icon" style="bottom: 22%; right: 14%; font-size: 2.8rem; animation-delay: 1.8s;"></i>

  <!-- Main Error Card -->
  <main class="error-content-card" data-aos="zoom-in" data-aos-duration="600">
    
    <!-- Brand Logo -->
    <div class="error-brand-wrap">
      <a href="index.html" aria-label="Return to Stackly Home">
        <img src="assets/images/chan.webp" alt="Stackly Logo" class="error-brand-logo-img">
      </a>
    </div>

    <!-- Error Code Badge -->
    <div class="error-code-badge">
      <i class="fa-solid fa-kitchen-set"></i>
      <span>Kitchen Status #404</span>
    </div>

    <!-- Big 404 Number -->
    <h1 class="error-huge-number">404</h1>

    <!-- Headline -->
    <h2 class="error-title">This Recipe Left the Kitchen Table</h2>

    <!-- Description -->
    <p class="error-desc">
      The dish, ingredient list, or meal planning page you are trying to view might have been moved, renamed, or is currently simmering in our chef's private recipe drafts.
    </p>

    <!-- CTAs -->
    <div class="error-cta-group">
      <a href="index.html" class="btn btn-primary">
        <i class="fa-solid fa-house"></i>
        <span>Return to Home Kitchen</span>
      </a>
      <a href="explore.html" class="btn btn-outline-light">
        <i class="fa-solid fa-utensils"></i>
        <span>Explore All Recipes</span>
      </a>
    </div>

    <!-- Quick Navigation Links -->
    <!-- <div class="quick-links-pill-bar">
      <span class="quick-links-title">Popular Recipe Categories:</span>
      <div class="quick-links-items">
        <a href="explore.html?category=Breakfast"><i class="fa-solid fa-mug-saucer"></i> Breakfast</a>

        <a href="meal-plan.html"><i class="fa-solid fa-clipboard-list"></i> My Meal Plan</a>
        <a href="https://www.google.com/maps/place/Stackly/@11.6829566,78.1739798,17z/data=!3m1!4b1!4m6!3m5!1s0x3babefef7fd970bb:0xe11aef1a71994f9!8m2!3d11.6829566!4d78.1739798!16s%2Fg%2F11l660s35r?entry=ttu&g_ep=EgoyMDI2MDcwNy4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-map-location-dot"></i> Studio Location (Salem)</a>
      </div>
    </div> -->

  </main>

  <!-- AOS JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
    if (typeof AOS !== 'undefined') {
      AOS.init({ once: true });
    }
  </script>
</body>
</html>
